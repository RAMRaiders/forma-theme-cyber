# Checks and builds the theme, and uploads it as the `forma-theme-cyber` artifact that Forma's
# build bundles. Manual only: nothing is tagged, released or published.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run verify

      - uses: actions/upload-artifact@v4
        with:
          name: forma-theme-cyber
          path: dist/
          if-no-files-found: error
