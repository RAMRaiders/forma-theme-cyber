# Checks and builds the theme, and uploads it as the `forma-theme-cyber` artifact that Forma's
# build bundles. Manual only: nothing is tagged, released or published.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read
  # @ramraiders/forma-sdk comes from GitHub Packages; the package must grant this repo read
  # access (package settings → Manage Actions access).
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@ramraiders"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run verify

      - uses: actions/upload-artifact@v4
        with:
          name: forma-theme-cyber
          path: dist/
          if-no-files-found: error
