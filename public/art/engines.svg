<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="A game engine: a chip turning gears, running games">
  <!-- Cyber's own picture for the Engines category: a processor whose core is a gear, a second
       gear turning with it, and the games it runs floating up from it. -->
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a52"/>
      <stop offset="1" stop-color="#120a26"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4d6ff"/>
      <stop offset="0.5" stop-color="#a77bff"/>
      <stop offset="1" stop-color="#5b36b8"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff6ff"/>
      <stop offset="0.5" stop-color="#22e4ff"/>
      <stop offset="1" stop-color="#1166a8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- A gear: a ring of teeth around a hub, drawn once and reused. -->
    <g id="teeth">
      <rect x="-9" y="-62" width="18" height="18" rx="3"/>
    </g>
  </defs>

  <!-- Traces leaving the chip -->
  <g stroke="#a77bff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M150 150 H70 V110 H40"/>
    <path d="M150 190 H90 V230 H50"/>
    <path d="M330 150 H400 V100 H440"/>
    <path d="M330 190 H380 V250 H430"/>
    <path d="M220 280 V300 H160"/>
    <path d="M260 280 V305 H330"/>
  </g>
  <g fill="#22e4ff">
    <circle cx="40" cy="110" r="5"/><circle cx="50" cy="230" r="5"/>
    <circle cx="440" cy="100" r="5"/><circle cx="430" cy="250" r="5"/>
    <circle cx="160" cy="300" r="5"/><circle cx="330" cy="305" r="5"/>
  </g>

  <!-- The chip, with its pins -->
  <g fill="#7d5cd6">
    <rect x="168" y="94" width="10" height="16" rx="2"/><rect x="198" y="94" width="10" height="16" rx="2"/>
    <rect x="228" y="94" width="10" height="16" rx="2"/><rect x="258" y="94" width="10" height="16" rx="2"/>
    <rect x="288" y="94" width="10" height="16" rx="2"/>
    <rect x="168" y="270" width="10" height="16" rx="2"/><rect x="198" y="270" width="10" height="16" rx="2"/>
    <rect x="228" y="270" width="10" height="16" rx="2"/><rect x="258" y="270" width="10" height="16" rx="2"/>
    <rect x="288" y="270" width="10" height="16" rx="2"/>
    <rect x="136" y="132" width="16" height="10" rx="2"/><rect x="136" y="162" width="16" height="10" rx="2"/>
    <rect x="136" y="192" width="16" height="10" rx="2"/><rect x="136" y="222" width="16" height="10" rx="2"/>
    <rect x="314" y="132" width="16" height="10" rx="2"/><rect x="314" y="162" width="16" height="10" rx="2"/>
    <rect x="314" y="192" width="16" height="10" rx="2"/><rect x="314" y="222" width="16" height="10" rx="2"/>
  </g>
  <rect x="150" y="108" width="166" height="164" rx="14" fill="url(#die)" stroke="#a77bff" stroke-width="3"/>
  <rect x="160" y="118" width="146" height="144" rx="9" fill="none" stroke="#a77bff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- The big gear, the chip's core -->
  <g transform="translate(233 190)" filter="url(#glow)">
    <g fill="url(#metal)">
      <use href="#teeth"/>
      <use href="#teeth" transform="rotate(45)"/>
      <use href="#teeth" transform="rotate(90)"/>
      <use href="#teeth" transform="rotate(135)"/>
      <use href="#teeth" transform="rotate(180)"/>
      <use href="#teeth" transform="rotate(225)"/>
      <use href="#teeth" transform="rotate(270)"/>
      <use href="#teeth" transform="rotate(315)"/>
      <circle r="48"/>
    </g>
    <circle r="30" fill="#120a26"/>
    <!-- Play, at the heart of it -->
    <path d="M-9 -15 L17 0 L-9 15 Z" fill="#ff2e88"/>
  </g>

  <!-- The small gear, meshing with it -->
  <g transform="translate(294 130) scale(0.5) rotate(22)" filter="url(#glow)">
    <g fill="url(#metal2)">
      <use href="#teeth"/>
      <use href="#teeth" transform="rotate(45)"/>
      <use href="#teeth" transform="rotate(90)"/>
      <use href="#teeth" transform="rotate(135)"/>
      <use href="#teeth" transform="rotate(180)"/>
      <use href="#teeth" transform="rotate(225)"/>
      <use href="#teeth" transform="rotate(270)"/>
      <use href="#teeth" transform="rotate(315)"/>
      <circle r="48"/>
    </g>
    <circle r="20" fill="#0a1324"/>
  </g>

  <!-- What it runs, floating up: a pixel hero, a code tag and a heart -->
  <g filter="url(#glow)">
    <!-- pixel hero -->
    <g transform="translate(78 30)" fill="#3dffa0">
      <rect x="8" y="0" width="16" height="8"/>
      <rect x="4" y="8" width="24" height="8"/>
      <rect x="8" y="16" width="16" height="12"/>
      <rect x="0" y="16" width="8" height="8"/><rect x="24" y="16" width="8" height="8"/>
      <rect x="8" y="28" width="6" height="10"/><rect x="18" y="28" width="6" height="10"/>
    </g>
    <rect x="86" y="38" width="4" height="4" fill="#04060c"/>
    <rect x="98" y="38" width="4" height="4" fill="#04060c"/>
    <!-- code tag -->
    <text x="372" y="40" font-family="DejaVu Sans Mono, monospace" font-size="34" font-weight="700" fill="#ffb547">&lt;/&gt;</text>
    <!-- pixel heart -->
    <g transform="translate(200 18)" fill="#ff2e88">
      <rect x="4" y="0" width="8" height="4"/><rect x="16" y="0" width="8" height="4"/>
      <rect x="0" y="4" width="28" height="8"/>
      <rect x="4" y="12" width="20" height="4"/>
      <rect x="8" y="16" width="12" height="4"/>
      <rect x="12" y="20" width="4" height="4"/>
    </g>
  </g>
  <!-- Sparks rising from the chip to them -->
  <g fill="#22e4ff" opacity="0.8">
    <rect x="120" y="78" width="4" height="4"/><rect x="132" y="60" width="3" height="3"/>
    <rect x="214" y="62" width="4" height="4"/><rect x="222" y="48" width="3" height="3"/>
    <rect x="352" y="62" width="4" height="4"/><rect x="368" y="54" width="3" height="3"/>
  </g>
</svg>
